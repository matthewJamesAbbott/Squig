services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ddc-qdrant
    ports:
      - "6333:6333"   # HTTP
      - "6334:6334"   # gRPC
    volumes:
      # Named volume (data persists across container recreations).
      # If you'd rather pin it to a fixed host path, replace with a bind
      # mount (requires sudo once to create /data/qdrant):
      #   /data/qdrant:/qdrant/storage
      - ddc-qdrant-data:/qdrant/storage
    # Local-only, no auth needed.
    # Storage is in-memory by default (fast for our 1024-dim vectors).
    # If the collection ever grows past ~200GB of vectors, switch to mmap
    # to keep memory bounded:
    #   environment:
    #     - ON_DISK_VECTORS=1
    #     - QDRANT__storage__vector_struct_config__mmap=true
    healthcheck:
      # The official image has no wget/curl; use bash's /dev/tcp connect.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  ddc-qdrant-data:
